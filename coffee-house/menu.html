<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="src/img/favicon.ico" />
    <link rel="stylesheet" href="dist/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Resource | Menu</title>
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <div class="header__logo">
          <a href="index.html" class="logo"><span class="logo-icon"></span></a>
        </div>
        <nav class="header__navigation">
          <ul class="navigation">
            <li class="navigation__item">
              <a href="index.html#favorites-coffee" class="navigation__link"
                >Favorite coffee</a
              >
            </li>
            <li class="navigation__item">
              <a href="index.html#about" class="navigation__link">About</a>
            </li>
            <li class="navigation__item">
              <a href="index.html#mobile-app" class="navigation__link"
                >Mobile app</a
              >
            </li>
            <li class="navigation__item">
              <a href="#contacts" class="navigation__link">Contact us</a>
            </li>
          </ul>
          <div class="header__menu-btn">
            <a href="#" class="menu-button menu-button_active">
              <span class="menu-button__text">Menu</span>
              <span class="icon icon_cup"></span>
            </a>
          </div>
        </nav>
        <div class="header__hamburger-btn">
          <button class="button hamburger-btn">
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="menu">
        <div class="container menu__container">
          <div class="menu__offer">
            <h1 class="menu__title">
              Behind each of our cups hides an
              <span class="menu__title_accent">amazing surprise</span>
            </h1>
            <div class="menu__buttons">
              <div
                class="button tabs-button tabs-button_active"
                data-category="coffee"
              >
                <div class="tabs-button__icon">
                  <span class="icon icon_coffee"></span>
                </div>
                Coffee
              </div>
              <div class="button tabs-button" data-category="tea">
                <div class="tabs-button__icon">
                  <span class="icon icon_tea"></span>
                </div>
                Tea
              </div>
              <div class="button tabs-button" data-category="dessert">
                <div class="tabs-button__icon">
                  <span class="icon icon_dessert"></span>
                </div>
                Dessert
              </div>
            </div>
          </div>
          <div class="menu__items">
          </div>
          <button class="menu__add-button button button_icon-dark">
            <svg class="icon icon_refresh">
              <use href="./src/img/icons/refresh.svg#icon"></use>
            </svg>
          </button>
        </div>
      </section>
    </main>
    <footer class="contacts" id="contacts">
      <div class="container contacts__container">
        <div class="contacts__wrapper">
          <div class="contacts__offer">
            <h2 class="contacts__title">
              Sip, Savor, Smile.
              <span class="contacts__title_accent">It’s coffee time!</span>
            </h2>
            <div class="contacts__social">
              <a
                class="button button_icon-light"
                href="http://twitter.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="icon icon_twitter">
                  <use href="./src/img/icons/twitter.svg#icon"></use>
                </svg>
              </a>
              <a
                class="button button_icon-light"
                href="http://instagram.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="icon icon_instagram">
                  <use href="./src/img/icons/instagram.svg#icon"></use>
                </svg>
              </a>
              <a
                class="button button_icon-light"
                href="http://facebook.com"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="icon icon_facebook">
                  <use href="./src/img/icons/facebook.svg#icon"></use>
                </svg>
              </a>
            </div>
          </div>
          <div class="contacts__info contacts-info">
            <h3 class="contacts-info__title">Contact us</h3>
            <ul class="contacts-info__links">
              <li class="contacts-info__item">
                <a
                  class="contacts-info__link"
                  href="https://maps.app.goo.gl/YSnVaF5zZnJnzM5N9"
                  target="_blank"
                  rel="noopener noreferrer"
                  ><span class="icon icon_pin"></span>8558 Green
                  Rd.,&nbsp;&nbsp;LA</a
                >
              </li>
              <li class="contacts-info__item">
                <a class="contacts-info__link" href="tel:+16035550123"
                  ><span class="icon icon_phone"></span>+1 (603) 555-0123</a
                >
              </li>
              <li class="contacts-info__item">
                <span class="icon icon_clock"></span>Mon-Sat: 9:00 AM – 23:00 PM
              </li>
            </ul>
          </div>
        </div>
      </div>
    </footer>
    <div class="modal">
      <div class="modal__overlay">
        <div class="modal__content"></div>
      </div>
    </div>
    <script src="src/script/burger.js"></script>
    <script type="module" src="src/script/menu.js"></script>
  </body>
</html>
